# =============================================================================
# usulnet - golangci-lint configuration (v2 schema)
# =============================================================================
# Run: golangci-lint run ./...
# Docs: https://golangci-lint.run/usage/configuration/
# Migration notes: golangci-lint v2 enables staticcheck, govet, errcheck,
# ineffassign, and unused by default. gofmt and goimports moved to the
# `formatters` section. See:
# https://golangci-lint.run/docs/product/migration-guide/
# =============================================================================
version: "2"
run:
  go: "1.25"
  tests: true
output:
  formats:
    text:
      path: stdout
  sort-order:
    - linter
    - severity
    - file
linters:
  # NOTE: `prealloc` is intentionally not in the enabled set. It is a
  # performance-hint linter whose suggestions ("make([]T, 0,
  # len(source))" before an append-only range loop) deliver no
  # measurable benefit at the slice sizes this codebase deals with
  # (config maps, container lists, request batches — all well below
  # the allocation threshold where preallocation matters), and the
  # suggestions clutter every list-building helper with boilerplate
  # that obscures intent. Hot paths are protected by the benchmarks
  # under tests/benchmarks/ instead.
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - whitespace
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      # Exclusions are for calls whose error path is genuinely safe to
      # discard (cleanup on shutdown, best-effort deadline plumbing,
      # logger flushes that buffer-fill on process exit). Real
      # error-producing calls (database mutations, JSON parsing of
      # user input, NATS publish) are NOT here — those still need an
      # explicit `_ = ...` or proper handling.
      exclude-functions:
        - io.Copy
        - io.WriteTo
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprintf
        - fmt.Fprintln
        # JSON response encoding: by the time we're streaming the
        # response body, the status code is already on the wire — an
        # Encode failure is logged by the HTTP server middleware and
        # there is no way to recover the response at this point.
        - (*encoding/json.Encoder).Encode
        # fmt.Sscanf is used pervasively for best-effort parsing of
        # docker stats, /proc lines, and human-readable strings where
        # a parse miss leaves the target variable at its zero value
        # (the desired fallback).
        - fmt.Sscanf
        # Logger flush at process tear-down — there is no consumer for
        # the error and the program is about to exit anyway.
        - (*go.uber.org/zap.Logger).Sync
        - (*go.uber.org/zap.SugaredLogger).Sync
        - (*github.com/fr4nsys/usulnet/internal/pkg/logger.Logger).Sync
        # WebSocket deadlines: a SetReadDeadline / SetWriteDeadline
        # error means the connection is already gone, which the next
        # Read/Write will surface immediately with a better message.
        - (*github.com/gorilla/websocket.Conn).SetReadDeadline
        - (*github.com/gorilla/websocket.Conn).SetWriteDeadline
        # pgx transaction rollback: the doc-recommended pattern is to
        # defer rollback unconditionally and ignore the "tx already
        # committed" error path it produces on the happy commit.
        - (*github.com/jackc/pgx/v5.Tx).Rollback
        - (github.com/jackc/pgx/v5.Tx).Rollback
        # mime.AddExtensionType: returns an error when the extension
        # value is malformed; we register only static literal types.
        - mime.AddExtensionType
        # NATS subscription teardown — deliberate fire-and-forget on
        # service shutdown and on error-path cleanup.
        - (*github.com/nats-io/nats.go.Subscription).Unsubscribe
        - (*github.com/nats-io/nats.go.Subscription).AutoUnsubscribe
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - commentFormatting
      enabled-tags:
        - diagnostic
        - performance
    gosec:
      excludes:
        - G101
        - G104
        - G304
      severity: medium
      confidence: medium
      config:
        global:
          audit: false
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unexported-return
          disabled: true
        - name: var-naming
          disabled: true
    staticcheck:
      checks:
        - all
        - -SA1019
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - gosec
          - govet
        path: _test\.go
      - linters:
          - all
        path: _templ\.go
      - linters:
          - gocritic
        path: migrations/
      - linters:
          - gocritic
        path: internal/api/handlers/
        text: ifElseChain
      - linters:
          - gocritic
        path: cmd/
        text: initClause
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked
      - path: (.+)\.go$
        text: 'printf: non-constant format string'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
severity:
  default: warning
  rules:
    - linters:
        - gosec
      severity: error
    - linters:
        - errcheck
        - govet
      severity: error
    - linters:
        - misspell
        - whitespace
      severity: info
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fr4nsys/usulnet
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
