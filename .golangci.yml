# =============================================================================
# usulnet - golangci-lint configuration (v2 schema)
# =============================================================================
# Run: golangci-lint run ./...
# Docs: https://golangci-lint.run/usage/configuration/
# Migration notes: golangci-lint v2 enables staticcheck, govet, errcheck,
# ineffassign, and unused by default. gofmt and goimports moved to the
# `formatters` section. See:
# https://golangci-lint.run/docs/product/migration-guide/
# =============================================================================
version: "2"
run:
  go: "1.25"
  tests: true
output:
  formats:
    text:
      path: stdout
  sort-order:
    - linter
    - severity
    - file
linters:
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - prealloc
    - revive
    - unconvert
    - whitespace
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
      exclude-functions:
        - io.Copy
        - io.WriteTo
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprintf
        - fmt.Fprintln
    gocritic:
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - commentFormatting
      enabled-tags:
        - diagnostic
        - performance
    gosec:
      excludes:
        - G101
        - G104
        - G304
      severity: medium
      confidence: medium
      config:
        global:
          audit: false
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    misspell:
      locale: US
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unexported-return
          disabled: true
        - name: var-naming
          disabled: true
    staticcheck:
      checks:
        - all
        - -SA1019
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
          - gosec
          - prealloc
        path: _test\.go
      - linters:
          - all
        path: _templ\.go
      - linters:
          - gocritic
        path: migrations/
      - linters:
          - gocritic
        path: internal/api/handlers/
        text: ifElseChain
      - linters:
          - gocritic
        path: cmd/
        text: initClause
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked
      - path: (.+)\.go$
        text: 'printf: non-constant format string'
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
severity:
  default: warning
  rules:
    - linters:
        - gosec
      severity: error
    - linters:
        - errcheck
        - govet
      severity: error
    - linters:
        - misspell
        - whitespace
      severity: info
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fr4nsys/usulnet
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
