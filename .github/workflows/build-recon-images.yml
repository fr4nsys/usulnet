# Build and publish the recon-spiderfoot image.
#
# - On PR: build for both archs to validate the Dockerfile; do not push
#   (fork tokens cannot publish to the canonical ghcr.io/fr4nsys
#   namespace).
# - On main: build, push :latest + the short SHA, capture the new
#   digest, and open a PR that bumps internal/services/recon/images.go.
#
# The recon-toolkit image is rebuilt weekly by recon-toolkit-weekly.yml
# (and validated on toolkit-touching PRs by the same workflow) so the
# BlackArch overlay stays current under `pacman -Syu`.
#
# Image source: docs/recon.md §12 and docs/v26.5/technical-notes.md
# ("Build artifacts and CI").

name: build-recon-images

on:
  push:
    branches: [main]
    paths:
      - "deploy/recon/spiderfoot/**"
      - ".github/workflows/build-recon-images.yml"
  pull_request:
    paths:
      - "deploy/recon/spiderfoot/**"
      - ".github/workflows/build-recon-images.yml"

env:
  REGISTRY: ghcr.io
  SPIDERFOOT_IMAGE: ghcr.io/fr4nsys/usulnet-recon-spiderfoot
  PLATFORMS: linux/amd64,linux/arm64

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-spiderfoot:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          short_sha=$(git rev-parse --short=12 HEAD)
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=${SPIDERFOOT_IMAGE}:pr-${{ github.event.pull_request.number }}-${short_sha}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${SPIDERFOOT_IMAGE}:latest,${SPIDERFOOT_IMAGE}:${short_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/recon/spiderfoot
          platforms: ${{ env.PLATFORMS }}
          # PR builds only verify the Dockerfile compiles across archs;
          # publishing to ghcr.io/fr4nsys requires the canonical repo's
          # token, which fork PRs do not have.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          cache-from: type=gha,scope=recon-spiderfoot
          cache-to: type=gha,scope=recon-spiderfoot,mode=max

  bump-image-pins:
    # Only on main: open a PR that updates the SpiderFootImageDigest
    # constant in internal/services/recon/images.go so the Go binary
    # tracks the exact image it should pull. The toolkit digest is
    # bumped separately by recon-toolkit-weekly.yml.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-spiderfoot]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update images.go
        env:
          SPIDERFOOT_DIGEST: ${{ needs.build-spiderfoot.outputs.digest }}
        run: |
          set -eu
          file=internal/services/recon/images.go
          python3 - "$file" "$SPIDERFOOT_DIGEST" <<'PY'
          import re, sys
          path, spiderfoot = sys.argv[1], sys.argv[2]
          src = open(path).read()
          src = re.sub(
              r'(SpiderFootImageDigest\s*=\s*")sha256:[0-9a-f]{64}(")',
              r'\g<1>' + spiderfoot + r'\g<2>',
              src,
          )
          open(path, "w").write(src)
          PY

      - name: Open PR with digest bump
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(recon): bump pinned spiderfoot digest"
          title: "chore(recon): bump pinned spiderfoot digest"
          body: |
            Automated PR opened by `build-recon-images.yml`.

            Updates `SpiderFootImageDigest` in
            `internal/services/recon/images.go` after a successful
            build+push of the recon-spiderfoot image on `main`.

            - spiderfoot digest: `${{ needs.build-spiderfoot.outputs.digest }}`
          branch: chore/recon-spiderfoot-digest-bump
          base: main
          delete-branch: true
          add-paths: |
            internal/services/recon/images.go
